name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build bundles
        run: npm run tauri build -- --bundles appimage rpm
      - name: Collect and rename assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          appimage_src="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          rpm_src="$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' | head -n 1)"
          install -m 0644 "$appimage_src" "fedora-mirror-manager_${version}_linux_x86_64.AppImage"
          install -m 0644 "$rpm_src" "fedora-mirror-manager_${version}_linux_x86_64.rpm"

      - name: Generate checksums
        run: sha256sum fedora-mirror-manager_*_linux_x86_64.AppImage fedora-mirror-manager_*_linux_x86_64.rpm > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fedora-mirror-manager_*_linux_x86_64.AppImage
            fedora-mirror-manager_*_linux_x86_64.rpm
            SHA256SUMS
